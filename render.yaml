# ============================================================
# Render 部署設定
# ------------------------------------------------------------
# 兩個服務 + 一個資料庫：
#   web  靜態前端（走 CDN，即時載入）
#   api  FastAPI 後端
#   db   PostgreSQL
# ============================================================

databases:
  - name: fambudget-db
    plan: free
    databaseName: fambudget
    user: fambudget

services:
  # ---------- 前端：純靜態 ----------
  - type: web
    name: fambudget-web
    runtime: static
    buildCommand: ""
    staticPublishPath: ./frontend
    pullRequestPreviewsEnabled: false
    # 這裡刻意沒有 rewrite 規則。
    # 前端走的是 hash 路由（#/entry），瀏覽器只會跟伺服器要 "/"，
    # 井號後面完全不會送出去 —— 所以不需要「任何路徑都回 index.html」。
    # 而且那種規則有機會把 /docs/*.html 這些真實檔案一起吃掉。
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN

  # ---------- 後端：FastAPI ----------
  - type: web
    name: fambudget-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        fromDatabase:
          name: fambudget-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://fambudget-web.onrender.com,http://localhost:5174
      # 下面兩個要在 Render 後台自行填入，不要寫進 repo
      - key: JWT_SECRET
        sync: false
      # 我們自己微調的模型服務網址。留空時後端會回傳假資料，
      # 前後端仍然串得起來。
      - key: MODEL_BASE_URL
        sync: false
