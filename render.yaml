services:
  - type: web
    name: llm-capstone-top20
    runtime: static
    buildCommand: ""
    staticPublishPath: ./site
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
