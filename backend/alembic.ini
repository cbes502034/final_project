# ============================================================
# Alembic config. Keep this file ASCII-only:
# on Windows (cp950) alembic reads .ini with the system encoding,
# so any Chinese character here breaks every alembic command.
# The Chinese how-to lives in alembic/env.py and backend/README.md.
#
# Run inside backend/:
#   alembic upgrade head
#   alembic revision --autogenerate -m "what changed"
#   alembic downgrade -1
#
# The database URL is NOT here: alembic/env.py reads DATABASE_URL
# from app/toolkit/config.py. Owner: member 1 (shared).
# ============================================================

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
