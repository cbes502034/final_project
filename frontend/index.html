<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16493F">
<meta name="description" content="家庭記帳與財務控管系統 — 一句話記帳、家庭階層權限、子女消費監管、月年統計、LLM 財務建議。">

<!-- ============================================================
     後端接口：留空 = 用 js/data.js 的模擬資料（mock 模式）
     後端做好後填上網址即可切換，畫面程式碼不用改，例如：
         <meta name="api-base" content="http://localhost:8000">
     完整的路由契約寫在 js/api.js 最上面。
     ============================================================ -->
<meta name="api-base" content="">

<title>家庭記帳與財務控管系統</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2305060A'/%3E%3Crect x='2.5' y='3.5' width='11' height='9' fill='none' stroke='%236C9FFB' stroke-width='1.3'/%3E%3Cpath d='M5 7h6M5 9.5h4' stroke='%236C9FFB' stroke-width='1.2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap">
<!-- 主題：在 CSS 載入之前就掛上，重新整理時不會先閃一下米白再變色。
     登入之後以帳號存的為準（app.js 的 applyTheme），這裡只是記住這台裝置上次用的。 -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('fambudget.theme');
      if (t && /^[a-z]+$/.test(t)) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="css/tokens.css?v=142">
<link rel="stylesheet" href="css/app.css?v=142">
<link rel="stylesheet" href="css/themes.css?v=142">
</head>
<body>

<canvas id="stars" aria-hidden="true"></canvas>

<div class="app">

  <!-- ============================================================
       頂列：像銀行 App 的首頁
       沒有側欄。所有功能都在「總覽」的儀表板上；其他頁面左上角有「總覽」可以回去。
       右邊只放兩樣每一頁都用得到的：通知、我的帳號。
       ============================================================ -->
  <header class="appbar">
    <div class="appbar__in">
      <a class="appbar__brand" href="#/" aria-label="回到總覽">
        <span class="brand__m" aria-hidden="true">帳</span><span class="appbar__n">家庭記帳</span>
      </a>
      <a class="appbar__home" id="homeBtn" href="#/" hidden><svg class="appbar__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6 9 12l6 6"/></svg><span>總覽</span></a>
      <span class="appbar__sp"></span>
      <!-- 電腦版：不在總覽時，右上角隨時能記一筆（手機用底部分頁中間那顆） -->
      <button class="appbar__add" data-quick="entry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>記一筆</span></button>
      <div class="bell__wrap">
        <button class="bell" id="bell" title="通知" aria-label="通知">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 9a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M10.5 20a2 2 0 0 0 3 0"/></svg>
          <span class="bell__n" id="bellDot" hidden>0</span>
        </button>
        <div class="bell__panel" id="bellPanel" hidden></div>
      </div>
      <div class="acctm" id="acctm">
        <button class="acctm__b" id="acctBtn" aria-expanded="false" aria-controls="acctPanel" aria-label="我的帳號">
          <span id="who"></span><svg class="acctm__cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <!-- 我的帳戶卡：放儀表板上「沒有」的東西——
             記帳習慣、家人、快速換主題。功能入口都在儀表板上，這裡不再列一次。 -->
        <div class="acctm__p" id="acctPanel" hidden>
          <button type="button" class="acctm__h" id="whoCard" data-nav="profile"></button>
          <div class="acctm__habit" id="acctHabit"></div>
          <button type="button" class="acctm__fam" id="acctFam" data-nav="members"></button>
          <div class="acctm__row">
            <div class="acctm__k">主題</div>
            <div class="acctm__sws" id="acctThemes"></div>
          </div>
          <div class="acctm__ft">
            <a href="docs/guide.html">使用說明</a>
            <a href="docs/index.html">專題文件</a>
            <button type="button" class="acctm__out" id="logout"><svg class="acctm__oi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h5v16h-5"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h10"/></svg><span>登出</span></button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- 第一層標題：頁面。右邊是這一頁的切換與工具（我｜全家、帳本、搜尋） -->
    <div class="phead" id="phead">
      <div class="phead__m">
        <div class="phead__k" id="pkick"></div>
        <h1 class="phead__t" id="ptitle">總覽</h1>
        <p class="phead__s" id="psub" hidden></p>
      </div>
      <div class="phead__r">
        <div class="phead__a" id="pact" hidden></div>
        <div class="phead__tools">
          <div class="gsw" id="gsw" hidden></div>
          <button class="ic" id="searchBtn" title="搜尋" aria-label="搜尋">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
          <div class="search" id="searchDrawer" hidden>
            <input id="search" type="search" placeholder="搜尋店家或備註" autocomplete="off">
          </div>
        </div>
      </div>
    </div>

    <div id="view"></div>

    <footer class="foot">家庭記帳　·　目前顯示的是示範資料</footer>
  </main>

  <!-- 手機：底部分頁。富邦、元大的 App 都是這樣——常用的四頁 ＋ 中間的記一筆 -->
  <nav class="tabbar" aria-label="主要頁面">
    <a class="tabbar__i" href="#/" data-tab=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/></svg><span>總覽</span></a>
    <a class="tabbar__i" href="#/entry" data-tab="entry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h10l4 4v12H5z"/><path d="M15 4v4h4"/><path d="M9 13h6M9 16.5h4"/></svg><span>明細</span></a>
    <button class="tabbar__i tabbar__add" data-quick="entry" aria-label="記一筆"><span class="tabbar__o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span>記一筆</span></button>
    <a class="tabbar__i" href="#/stats" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg><span>統計</span></a>
    <a class="tabbar__i" href="#/advice" data-tab="advice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0-3.5 10.9V17h7v-3.1A6 6 0 0 0 12 3z"/><path d="M9.5 20.5h5"/></svg><span>建議</span></a>
  </nav>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="js/stars.js?v=142"></script>
<script src="js/data.js?v=142"></script>
<script src="js/api.js?v=142"></script>
<script src="js/notify.js?v=142"></script>
<script src="js/app.js?v=142"></script>
</body>
</html>
