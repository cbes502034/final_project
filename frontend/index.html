<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060A">
<meta name="description" content="家庭記帳與財務控管系統 — 一句話記帳、家庭階層權限、子女消費監管、月年統計、LLM 財務建議。">

<!-- ============================================================
     後端接口：留空 = 用 js/data.js 的模擬資料（mock 模式）
     後端做好後填上網址即可切換，畫面程式碼不用改，例如：
         <meta name="api-base" content="http://localhost:8000">
     完整的路由契約寫在 js/api.js 最上面。
     ============================================================ -->
<meta name="api-base" content="">

<title>家庭記帳與財務控管系統</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2305060A'/%3E%3Crect x='2.5' y='3.5' width='11' height='9' fill='none' stroke='%236C9FFB' stroke-width='1.3'/%3E%3Cpath d='M5 7h6M5 9.5h4' stroke='%236C9FFB' stroke-width='1.2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css?v=64">
<link rel="stylesheet" href="css/app.css?v=64">
</head>
<body>

<canvas id="stars" aria-hidden="true"></canvas>

<div class="app">

  <nav class="rail">
    <div class="brand">
      <span class="brand__n">家庭記帳</span>
    </div>

    <div class="nav">
      <div class="nav__lb">個人</div>
      <button class="nav__i" data-nav="">
        <svg class="nav__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        <span class="nav__t">我的總覽</span>
      </button>
      <button class="nav__i" data-nav="entry">
        <svg class="nav__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5v14M5 12h14"/></svg>
        <span class="nav__t">記帳</span>
      </button>

      <button class="nav__i" data-nav="groups">
        <svg class="nav__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/></svg>
        <span class="nav__t">群組</span>
      </button>
      <button class="nav__i" data-nav="profile">
        <svg class="nav__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.5"/><path d="M5 20v-1.5A5.5 5.5 0 0 1 10.5 13h3a5.5 5.5 0 0 1 5.5 5.5V20"/></svg>
        <span class="nav__t">個人資料</span>
      </button>

      <div class="nav__lb">家庭</div>
      <button class="nav__i" data-nav="family">
        <svg class="nav__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20v-2a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v2"/></svg>
        <span class="nav__t">家庭總覽</span>
      </button>
      <button class="nav__i" data-nav="stats">
        <svg class="nav__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V9M10 20V4M16 20v-7M22 20H2"/></svg>
        <span class="nav__t">統計</span>
      </button>
      <button class="nav__i" data-nav="advice">
        <svg class="nav__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3a6 6 0 0 0-3 11v3h6v-3a6 6 0 0 0-3-11z"/><path d="M10 20h4"/></svg>
        <span class="nav__t">財務建議</span>
      </button>
      <button class="nav__i" data-nav="members">
        <svg class="nav__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="10" width="16" height="10"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <span class="nav__t">成員與權限</span>
      </button>

    </div>

    <div class="docs">
      <div class="docs__lb">說明</div>
      <a class="docs__i docs__i--main" href="docs/guide.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 6.5S10 5 7 5H4v13h3c3 0 5 1.5 5 1.5S14 18 17 18h3V5h-3c-3 0-5 1.5-5 1.5z"/><path d="M12 6.5v13"/></svg>
        <span>使用說明</span>
      </a>
      <a class="docs__i" href="docs/index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 3h9l5 5v13H5z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>
        <span>專題文件</span>
        <i>↗</i>
      </a>
    </div>

    <div class="rail__f">
      <div class="quota__k" style="margin-bottom:8px">目前登入</div>
      <div class="who" id="who"></div>
      <div class="rail__sync" id="famName"></div>
    </div>
  </nav>

  <main class="main">
    <header class="top">
      <div><div class="top__t" id="ptitle">我的總覽</div></div>
      <div class="top__s" id="psub"></div>
      <span class="top__sp"></span>
      <div class="gsw" id="gsw" hidden></div>
      <button class="ic" id="searchBtn" title="搜尋" aria-label="搜尋">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <div class="search" id="searchDrawer" hidden>
        <svg class="search__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="搜尋店家或備註" autocomplete="off">
      </div>
      <div class="bell__wrap">
        <button class="bell" id="bell" title="監管通知" aria-label="監管通知">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 9a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M10.5 20a2 2 0 0 0 3 0"/></svg>
          <span class="bell__n" id="bellDot" hidden>0</span>
        </button>
        <div class="bell__panel" id="bellPanel" hidden></div>
      </div>
    </header>

    <div id="view"></div>

    <footer style="padding:24px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-dim);line-height:1.8">
      家庭記帳　·　目前顯示的是示範資料
    </footer>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="js/stars.js?v=64"></script>
<script src="js/data.js?v=64"></script>
<script src="js/api.js?v=64"></script>
<script src="js/notify.js?v=64"></script>
<script src="js/app.js?v=64"></script>
</body>
</html>
