<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070A0F">
<meta name="description" content="VULNSCOPE — 漏洞情資影響面判定與修補優先序。把漏洞公告抽成結構化欄位，與自建資產清單逐項比對，輸出「你有幾台受影響、先修哪一台」。">

<!-- ============================================================
     後端接口：留空 = 用 js/data.js 的模擬資料（mock 模式）
     後端做好後填上網址即可切換，畫面程式碼不用改，例如：
         <meta name="api-base" content="http://localhost:8000">
     完整的路由契約寫在 js/api.js 最上面。
     ============================================================ -->
<meta name="api-base" content="">

<title>VULNSCOPE · 漏洞影響面判定與修補優先序</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23070A0F'/%3E%3Cpath d='M8 2 13.5 4v4.5c0 3.2-2.3 5.4-5.5 6.2-3.2-.8-5.5-3-5.5-6.2V4z' fill='none' stroke='%2300D9C0' stroke-width='1.3'/%3E%3Crect x='6.6' y='6.4' width='2.8' height='2.8' fill='%2300D9C0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css?v=2">
<link rel="stylesheet" href="css/app.css?v=2">
</head>
<body>

<div class="app">

  <!-- ---------- 左側導覽 ---------- -->
  <nav class="rail">
    <div class="brand">
      <span class="brand__m" aria-hidden="true"></span>
      <span class="brand__n">VULNSCOPE</span>
      <span class="brand__v" id="mode"></span>
    </div>

    <div class="nav">
      <div class="nav__lb">監控</div>
      <button class="nav__i" data-nav="">
        <svg class="nav__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 13h5l2 6 4-14 2 8h5"/></svg>
        <span class="nav__t">總覽</span>
      </button>
      <button class="nav__i" data-nav="queue">
        <svg class="nav__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h16M4 18h9"/></svg>
        <span class="nav__t">修補優先序</span>
        <span class="nav__b" data-badge="queue"></span>
      </button>

      <div class="nav__lb">資料</div>
      <button class="nav__i" data-nav="advisories">
        <svg class="nav__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3h9l5 5v13H5z"/><path d="M14 3v5h5"/></svg>
        <span class="nav__t">漏洞情資</span>
      </button>
      <button class="nav__i" data-nav="assets">
        <svg class="nav__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5h18v6H3zM3 13h18v6H3z"/><path d="M7 8h.01M7 16h.01"/></svg>
        <span class="nav__t">資產清單</span>
        <span class="nav__b nav__b--hot" data-badge="assets"></span>
      </button>
      <button class="nav__i" data-nav="trace">
        <svg class="nav__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V10M10 20V4M16 20v-7M22 20h-20"/></svg>
        <span class="nav__t">查詢軌跡</span>
      </button>
    </div>

    <div class="rail__f">
      <div class="quota__t">
        <span class="quota__k">NVD 額度 / 30 秒</span>
        <span class="quota__v" id="qtxt">—</span>
      </div>
      <div class="quota__bar"><i id="qbar" style="width:0"></i></div>
      <div class="rail__sync" id="synced"></div>
    </div>
  </nav>

  <!-- ---------- 主欄 ---------- -->
  <main class="main">
    <header class="top">
      <div>
        <div class="top__t" id="ptitle">總覽</div>
      </div>
      <div class="top__s" id="psub"></div>
      <span class="top__sp"></span>
      <div class="search">
        <svg class="search__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="搜尋 CVE、產品、資產…" autocomplete="off">
      </div>
      <button class="btn btn--go" id="sync">同步 NVD</button>
    </header>

    <div class="mock">
      <b>前端原型</b>
      <span>沒有後端。資產與判定結果為模擬資料，CVE 內容取自 NVD 真實資料。接後端只要填 <code>&lt;meta name="api-base"&gt;</code>。</span>
    </div>

    <div id="view"></div>

    <footer style="padding:24px;border-top:1px solid var(--line);font-size:11px;color:var(--t4);line-height:1.8">
      This product uses data from the NVD API but is not endorsed or certified by the NVD.
    </footer>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="js/data.js?v=2"></script>
<script src="js/api.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
