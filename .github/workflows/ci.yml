# ============================================================
# 推上去 → 跑測試 → 測試過了才部署
# ------------------------------------------------------------
# 結果看這裡：GitHub 上這個 repo 的 Actions 分頁。
#
# ⚠️ 部署那一段要先設定好才會動，怎麼設定寫在 docs/03-CICD.md。
#    沒設定的話它會自己跳過（不會紅燈），測試照跑。
# ============================================================
name: CI

on:
  push:
    branches: ["**"]          # 每個人的分支推上去也會跑，不用等合併才發現壞了
  pull_request:
    branches: [main]
  workflow_dispatch:          # Actions 分頁上可以手動按一次

# 同一個分支連續推好幾次，只留最後一次在跑，不要排隊浪費額度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------
  # 測試：570 多個，包含前端 api.js 的保證（那幾個需要 node）
  # ----------------------------------------------------------
  test:
    name: 測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 裝 Python
        uses: actions/setup-python@v5
        with:
          # 版本跟著 backend/.python-version 走，不要在這裡再寫死一次
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # test_frontend_adapter.py 與 test_consistency.py 會用 node 把 frontend/js/api.js
      # 載進來跑。沒有 node 的話那幾個測試會自己跳過——CI 上不可以讓它們跳過。
      - name: 裝 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 裝套件
        run: pip install -r backend/requirements.txt

      - name: 環境對照（暫時：查 CI 與本機的差別）
        working-directory: backend
        env:
          DATABASE_URL: sqlite://
          JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef
        run: |
          pip list | grep -Ei '^(fastapi|starlette|pydantic|sqlalchemy|bcrypt|httpx|pytest) ' || true
          python - <<'PYEOF'
          from app.main import app
          from app.routers._stub import is_stub
          n = s = 0
          bad = []
          for r in app.routes:
              p = getattr(r, "path", "")
              if not p.startswith("/api"):
                  continue
              for m in (getattr(r, "methods", None) or set()) - {"HEAD", "OPTIONS"}:
                  n += 1
                  if is_stub(r.endpoint):
                      s += 1
                  elif p.startswith(("/api/summary", "/api/budgets", "/api/alerts", "/api/savings")):
                      bad.append(m + " " + p)
          print("路由", n, "還是 stub 的", s)
          print("成員3 的路由卻沒有 stub 標記：", bad)
          PYEOF

      - name: 跑測試
        working-directory: backend
        run: |
          set -o pipefail
          pytest -q --tb=short | tee "$RUNNER_TEMP/pytest.log"

      # ⚠️ Actions 的 log 要下載得有 admin 權限，網頁版又是虛擬捲動、Summary 在
      #    run 頁面上也讀不到——組員看不到自己為什麼紅。annotation 不一樣：
      #    它在 run 頁面最上面，而且公開就讀得到。
      - name: 測試沒過就標出來
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/pytest.log"
          [ -f "$log" ] || { echo "::error::沒有產生 pytest.log，看上面「跑測試」那一步"; exit 0; }
          grep -E '^(FAILED|ERROR) ' "$log" | head -n 25 | while IFS= read -r line; do
            echo "::error::$line"
          done
          {
            echo "### 測試沒過"
            echo ""
            echo '```'
            tail -n 150 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 把完整的測試輸出留下來
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: ${{ runner.temp }}/pytest.log
          if-no-files-found: ignore

      - name: 分工有沒有跟程式走散
        working-directory: backend
        env:
          DATABASE_URL: sqlite://
          JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef
        run: python -m app.ownership

  # ----------------------------------------------------------
  # 部署：只有 main、只有測試過了才跑
  #
  # 用 Render 的 API（不是 Deploy Hook），因為 Hook 打完就結束——
  # 部署成功沒成功、為什麼失敗，都只有 Render workspace 的成員進後台才看得到。
  # 走 API 的話，狀態與失敗時的 log 會印在這裡，**四個人都看得到**。
  #
  # ⚠️ secrets 不可以寫在 if: 裡面（GitHub 的 if 只認得 github／needs／vars／
  #    env／steps 這幾個 context，寫了整個 workflow 會被拒絕解析、一個 job
  #    都不會建立）。所以服務 ID 用 vars（不是機密），只有金鑰放 secrets。
  # ----------------------------------------------------------
  deploy:
    name: 部署到 Render
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: 還沒設定就講一聲
        if: vars.RENDER_BACKEND_SERVICE_ID == '' && vars.RENDER_WEB_SERVICE_ID == ''
        run: |
          {
            echo "### 部署跳過了"
            echo ""
            echo "還沒設定 Render 的服務 ID 與 API 金鑰。照 \`docs/03-CICD.md\` 設定好就會自動部署，"
            echo "而且部署的狀態與失敗時的 log 會直接印在這一頁——不用 Render 帳號也看得到。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 後端
        if: vars.RENDER_BACKEND_SERVICE_ID != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python .github/scripts/render_deploy.py 後端 "${{ vars.RENDER_BACKEND_SERVICE_ID }}"

      - name: 前端
        if: vars.RENDER_WEB_SERVICE_ID != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python .github/scripts/render_deploy.py 前端 "${{ vars.RENDER_WEB_SERVICE_ID }}"

  # ----------------------------------------------------------
  # 部署完再從外面打一次，確認站台真的活著
  # （Render 說 live 了，不代表我們的 /healthz 回得出 200）
  # ----------------------------------------------------------
  smoke:
    name: 部署後確認
    needs: deploy
    if: vars.BACKEND_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: 等後端回 200
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          url="${BACKEND_URL%/}/healthz"
          echo "等 $url ..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "  第 $i 次：$code"
            if [ "$code" = "200" ]; then
              {
                echo "### 站台活著"
                echo ""
                echo "- 後端 $url 回 200"
                if [ -n "$WEB_URL" ]; then echo "- 前端 $WEB_URL"; fi
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          {
            echo "### 部署完卻叫不動"
            echo ""
            echo "等了 10 分鐘 $url 還是沒有回 200。上面「部署到 Render」那個 job 有 Render 的 log。"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
