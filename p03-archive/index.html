<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070A0F">
<meta name="description" content="PHISHTRIAGE — 使用者回報釣魚郵件自動分流與話術辨識平台。把 300 份回報收斂成十幾張卡片，並辨識技術指標抓不到的中文詐騙話術。">

<!-- ============================================================
     後端接口：留空 = 用 js/data.js 的模擬資料（mock 模式）
     後端做好後填上網址即可切換，畫面程式碼不用改，例如：
         <meta name="api-base" content="http://localhost:8000">
     完整的路由契約寫在 js/api.js 最上面。
     ============================================================ -->
<meta name="api-base" content="">

<title>PHISHTRIAGE · 釣魚回報分流與話術辨識</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23070A0F'/%3E%3Crect x='2.5' y='4' width='11' height='8' fill='none' stroke='%2300D9C0' stroke-width='1.3'/%3E%3Cpath d='M2.5 4.5 8 8.5 13.5 4.5' fill='none' stroke='%2300D9C0' stroke-width='1.2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css?v=1">
<link rel="stylesheet" href="css/app.css?v=1">
</head>
<body>

<div class="app">

  <!-- ---------- 左側導覽 ---------- -->
  <nav class="rail">
    <div class="brand">
      <span class="brand__m" aria-hidden="true"></span>
      <span class="brand__n">PHISHTRIAGE</span>
      <span class="brand__v" id="mode"></span>
    </div>

    <div class="nav">
      <div class="nav__lb">分流</div>
      <button class="nav__i" data-nav="">
        <svg class="nav__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 13h5l2 6 4-14 2 8h5"/></svg>
        <span class="nav__t">總覽</span>
      </button>
      <button class="nav__i" data-nav="queue">
        <svg class="nav__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14"/><path d="m3 6 9 7 9-7"/></svg>
        <span class="nav__t">分流佇列</span>
        <span class="nav__b" data-badge="queue"></span>
      </button>
      <button class="nav__i" data-nav="dedup">
        <svg class="nav__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h18l-7 8v7l-4 2v-9z"/></svg>
        <span class="nav__t">收斂過程</span>
      </button>

      <div class="nav__lb">模型與資料</div>
      <button class="nav__i" data-nav="tactics">
        <svg class="nav__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h16M4 12h16M4 19h10"/><circle cx="19" cy="19" r="2"/></svg>
        <span class="nav__t">話術體系</span>
      </button>
      <button class="nav__i" data-nav="eval">
        <svg class="nav__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V8M10 20V4M16 20v-9M22 20H2"/></svg>
        <span class="nav__t">模型評測</span>
      </button>
      <button class="nav__i" data-nav="schema">
        <svg class="nav__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
        <span class="nav__t">資料庫架構</span>
      </button>
    </div>

    <div class="rail__f">
      <div class="quota__t">
        <span class="quota__k">本班次</span>
        <span class="quota__v">312 封 → 14 張</span>
      </div>
      <div class="quota__bar"><i style="width:4.5%"></i></div>
      <div class="rail__sync">收斂率 22.3 倍<br>2026-09-09 早班</div>
    </div>
  </nav>

  <!-- ---------- 主欄 ---------- -->
  <main class="main">
    <header class="top">
      <div><div class="top__t" id="ptitle">總覽</div></div>
      <div class="top__s" id="psub"></div>
      <span class="top__sp"></span>
      <div class="search">
        <svg class="search__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="搜尋主旨、寄件人、群組…" autocomplete="off">
      </div>
      <button class="btn btn--go" id="ingest">上傳 .eml</button>
    </header>

    <div class="mock">
      <b>前端原型</b>
      <span>沒有後端。郵件內容為虛構示範樣本，不含任何真實郵件或個資。接後端只要填 <code>&lt;meta name="api-base"&gt;</code>。</span>
    </div>

    <div id="view"></div>

    <footer style="padding:24px;border-top:1px solid var(--line);font-size:11px;color:var(--t4);line-height:1.8">
      第 3 題原型｜使用者回報釣魚郵件自動分流與話術辨識平台。示範資料為虛構樣本，非真實郵件。
    </footer>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="js/data.js?v=1"></script>
<script src="js/api.js?v=1"></script>
<script src="js/app.js?v=1"></script>
</body>
</html>
